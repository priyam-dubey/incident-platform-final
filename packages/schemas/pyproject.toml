[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-schemas"
version = "0.1.0"
description = "Shared Pydantic contracts for the AI-Native Observability platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
