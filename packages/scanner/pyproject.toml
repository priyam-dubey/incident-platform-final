[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-scanner"
version = "0.1.0"
description = "Deterministic, sandboxed static-analysis orchestration (no repository code is ever executed)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
incident_scanner = ["rules/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
