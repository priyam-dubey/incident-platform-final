name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schemas:
    name: Shared schemas (packages/schemas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: packages/schemas
        run: pip install -e ".[dev]"
      - name: Test
        working-directory: packages/schemas
        run: pytest -v

  db-migrations:
    name: DB migration runner (packages/db)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: incident_app
          POSTGRES_PASSWORD: incident_app_dev_password
          POSTGRES_DB: incident_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U incident_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: packages/db
        run: pip install -r requirements-dev.txt
      - name: Unit tests (checksum/discovery logic, no live DB required)
        working-directory: packages/db
        run: pytest -v
      - name: Apply migrations against real Postgres
        working-directory: packages/db/src
        env:
          DATABASE_URL: postgresql://incident_app:incident_app_dev_password@localhost:5432/incident_platform
        run: python migrate.py up
      - name: Verify idempotent re-run is a no-op
        working-directory: packages/db/src
        env:
          DATABASE_URL: postgresql://incident_app:incident_app_dev_password@localhost:5432/incident_platform
        run: python migrate.py up

  redaction:
    name: Redaction package (packages/redaction)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: packages/redaction
        run: pip install -e ".[dev]"
      - name: Test
        working-directory: packages/redaction
        run: pytest -v

  ingestion-service:
    name: Ingestion service (apps/ingestion-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: apps/ingestion-service
        run: pip install -r requirements-dev.txt
      - name: Test
        working-directory: apps/ingestion-service
        run: pytest -v

  correlation-engine:
    name: Correlation engine (apps/correlation-engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: apps/correlation-engine
        run: pip install -r requirements-dev.txt
      - name: Test
        working-directory: apps/correlation-engine
        run: pytest -v

  reasoning-service:
    name: Reasoning service (apps/reasoning-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: apps/reasoning-service
        run: pip install -r requirements-dev.txt
      - name: Test
        working-directory: apps/reasoning-service
        run: pytest -v

  llm:
    name: Central LLM client (packages/llm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: packages/llm
        run: pip install -e ".[dev]" && pytest -v

  api-gateway:
    name: API gateway (apps/api-gateway, real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: incident_app
          POSTGRES_PASSWORD: incident_app_dev_password
          POSTGRES_DB: incident_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U incident_app" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: apps/api-gateway
        run: pip install -r requirements-dev.txt
      - working-directory: apps/api-gateway
        env:
          TEST_DATABASE_URL: postgresql://incident_app:incident_app_dev_password@localhost:5432/incident_platform
        run: pytest -v

  node-sdk:
    name: Node SDK (packages/node-sdk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: packages/node-sdk
        run: npm ci && npm test

  e2e:
    name: End-to-end (gateway + ingestion + instrumented sample app)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: incident_app
          POSTGRES_PASSWORD: incident_app_dev_password
          POSTGRES_DB: incident_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U incident_app" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          pip install -r apps/api-gateway/requirements-dev.txt -r apps/ingestion-service/requirements.txt pytest-asyncio
          (cd examples/sample-express-app && npm install)
      - env:
          TEST_DATABASE_URL: postgresql://incident_app:incident_app_dev_password@localhost:5432/incident_platform
        run: pytest tests/e2e -v

  alert-router:
    name: Alert router (apps/alert-router)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: apps/alert-router
        run: pip install -r requirements-dev.txt
      - name: Test
        working-directory: apps/alert-router
        run: pytest -v

  dashboard:
    name: Dashboard (apps/dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: apps/dashboard
        run: npm install
      - name: Typecheck
        working-directory: apps/dashboard
        run: npx tsc --noEmit
      - name: Build
        working-directory: apps/dashboard
        run: npm run build

  ui-e2e:
    name: Browser e2e (Playwright + real gateway + Next build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: incident_app, POSTGRES_PASSWORD: incident_app_dev_password, POSTGRES_DB: incident_platform}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U incident_app" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: pip install -r apps/api-gateway/requirements-dev.txt playwright chdb && playwright install --with-deps chromium
      - run: npm ci && npx next build
        working-directory: apps/dashboard
        env: {NEXT_TELEMETRY_DISABLED: "1"}
      - run: python tests/e2e/ui/run_ui_e2e.py
        env:
          TEST_DATABASE_URL: postgresql://incident_app:incident_app_dev_password@localhost:5432/incident_platform
          UI_E2E_OUT: ${{ runner.temp }}/ui-out
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ui-e2e-screenshots, path: "${{ runner.temp }}/ui-out"}

  scanner:
    name: Scanner package (packages/scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e packages/scanner bandit ruff pytest
      - run: pytest packages/scanner -v   # tools not installed on the runner report "unavailable"; tests assert that honestly

  sql-lint:
    name: SQL lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sqlfluff==3.2.5
      - run: sqlfluff lint packages/db/migrations --dialect postgres
